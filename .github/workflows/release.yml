name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: Exact stable tag created for the tested commit
        required: true
        type: string
      sha:
        description: Exact commit SHA that passed the main CI workflow
        required: true
        type: string

concurrency:
  group: silicon-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silicon
          POSTGRES_PASSWORD: silicon-release
          POSTGRES_DB: silicon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon -d silicon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://silicon:silicon-release@localhost:5432/silicon_test?sslmode=disable
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - name: Validate stable semantic tag
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend
        working-directory: backend
        run: |
          go test -count=1 -p=1 ./...
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Verify installer and Compose
        run: |
          shellcheck install.sh deploy/tests/install_test.sh
          sh deploy/tests/install_test.sh
          POSTGRES_DB=silicon POSTGRES_USER=silicon POSTGRES_PASSWORD=test SILICON_ENCRYPTION_KEY=dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISEhISE= SILICON_PUBLIC_URL=http://localhost SILICON_COOKIE_SECURE=false SILICON_DATA_DIR=/tmp/silicon-data docker compose -f docker-compose.production.yml config --quiet
      - name: Build production services
        env:
          POSTGRES_DB: silicon
          POSTGRES_USER: silicon
          POSTGRES_PASSWORD: release-build-only
          SILICON_ENCRYPTION_KEY: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISEhISE=
          SILICON_PUBLIC_URL: http://localhost
          SILICON_COOKIE_SECURE: 'false'
          SILICON_DATA_DIR: /tmp/silicon-data
          SILICON_BUILD_VERSION: ${{ env.RELEASE_TAG }}
          SILICON_BUILD_COMMIT: ${{ env.RELEASE_SHA }}
        run: docker compose -f docker-compose.production.yml build backend frontend updater
      - name: Package release and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="Silicon-$RELEASE_TAG/" -o "dist/Silicon-$RELEASE_TAG.tar.gz" "$RELEASE_SHA"
          cd dist
          sha256sum "Silicon-$RELEASE_TAG.tar.gz" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '"\(.isDraft):\(.isPrerelease)"' 2>/dev/null || true)
          if [ "$state" = 'false:false' ]; then
            echo "Stable GitHub Release $RELEASE_TAG already exists"
            exit 0
          fi
          if [ -n "$state" ]; then
            echo "Release $RELEASE_TAG already exists but is draft or prerelease; refusing to replace it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Silicon $RELEASE_TAG"
