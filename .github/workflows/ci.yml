name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silicon
          POSTGRES_PASSWORD: silicon-ci
          POSTGRES_DB: silicon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon -d silicon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://silicon:silicon-ci@localhost:5432/silicon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend tests
        working-directory: backend
        run: |
          set +e
          output=$(go test -count=1 ./... 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary=$(printf '%s' "$output" | tail -c 3000)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Backend tests failed::$summary"
            exit "$status"
          fi
      - name: Verify backend static checks
        working-directory: backend
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify real Docker runtime lifecycle
        working-directory: backend
        env:
          SILICON_DOCKER_INTEGRATION: "1"
        run: |
          set +e
          output=$(go test -count=1 -timeout=6m -run '^TestDockerRuntimeProviderIntegration$' ./internal/providers/runtime/docker 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary=$(printf '%s' "$output" | tail -c 3000)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Docker runtime integration failed::$summary"
            exit "$status"
          fi
