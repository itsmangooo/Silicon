name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silicon
          POSTGRES_PASSWORD: silicon-ci
          POSTGRES_DB: silicon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon -d silicon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://silicon:silicon-ci@localhost:5432/silicon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend tests
        working-directory: backend
        run: |
          set +e
          # Database packages share the disposable silicon_test database and
          # intentionally reset its public schema, so keep package execution serial.
          output=$(go test -count=1 -p=1 ./... 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary=$(printf '%s' "$output" | tail -c 3000)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Backend tests failed::$summary"
            exit "$status"
          fi
      - name: Verify backend static checks
        working-directory: backend
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Verify retired Agent subsystem is absent
        run: |
          test ! -d backend/internal/agent
          test ! -d services/agent
          test ! -f .github/workflows/release-agent.yml
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Verify installers and production Compose
        run: |
          shellcheck install.sh deploy/tests/install_test.sh .github/scripts/*.sh
          sh deploy/tests/install_test.sh
          sh .github/scripts/test-next-release-tag.sh
          POSTGRES_DB=silicon POSTGRES_USER=silicon POSTGRES_PASSWORD=test SILICON_ENCRYPTION_KEY=dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISEhISE= SILICON_PUBLIC_URL=http://localhost SILICON_COOKIE_SECURE=false SILICON_DATA_DIR=/tmp/silicon-data docker compose -f docker-compose.production.yml config --quiet

  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify real Docker runtime lifecycle
        working-directory: backend
        env:
          SILICON_DOCKER_INTEGRATION: "1"
        run: |
          set +e
          output=$(go test -count=1 -timeout=6m -run '^TestDockerRuntimeProviderIntegration$' ./internal/providers/runtime/docker 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary=$(printf '%s' "$output" | tail -c 3000)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Docker runtime integration failed::$summary"
            exit "$status"
          fi

  production-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Silicon from a clean layout
        env:
          SILICON_REPOSITORY_URL: ${{ github.workspace }}
          SILICON_VERSION: ${{ github.sha }}
          SILICON_INSTALL_DIR: ${{ runner.temp }}/silicon-install
          SILICON_PUBLIC_URL: http://127.0.0.1:18080
          SILICON_HTTP_PORT: "18080"
        run: |
          ./install.sh
          before=$(sha256sum "$SILICON_INSTALL_DIR/config/silicon.env")
          ./install.sh
          after=$(sha256sum "$SILICON_INSTALL_DIR/config/silicon.env")
          test "$before" = "$after"
      - name: Show installation diagnostics on failure
        if: failure()
        run: docker compose --env-file "${{ runner.temp }}/silicon-install/config/silicon.env" -f "${{ runner.temp }}/silicon-install/source/docker-compose.production.yml" ps || true
      - name: Stop disposable installation
        if: always()
        run: |
          if test -f "${{ runner.temp }}/silicon-install/config/silicon.env"; then
            docker compose --env-file "${{ runner.temp }}/silicon-install/config/silicon.env" -f "${{ runner.temp }}/silicon-install/source/docker-compose.production.yml" down -v || true
          fi

  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, docker-runtime, production-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: silicon-automatic-patch-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the exact tested commit
        id: tag
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch --force --tags origin
          series=$(tr -d '[:space:]' < .github/release-series)
          stable_pattern="^v${series//./\\.}\\.(0|[1-9][0-9]*)$"
          existing=$(git tag --points-at "$TESTED_SHA" | grep -E "$stable_pattern" | head -n 1 || true)
          if [ -n "$existing" ]; then
            echo "Exact tested commit already has $existing"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list "v$series.*" --sort=-v:refname | grep -E "$stable_pattern" | head -n 1 || true)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" "$TESTED_SHA"; then
            if git merge-base --is-ancestor "$TESTED_SHA" "$latest"; then
              echo "A newer descendant ($latest) is already released; refusing to version an older commit."
              echo 'tag=' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Latest release $latest is not in the tested commit ancestry" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          attempts=0
          while [ "$attempts" -lt 5 ]; do
            attempts=$((attempts + 1))
            git fetch --force --tags origin
            existing=$(git tag --points-at "$TESTED_SHA" | grep -E "$stable_pattern" | head -n 1 || true)
            if [ -n "$existing" ]; then
              echo "Exact tested commit acquired $existing while waiting"
              echo "tag=$existing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(sh .github/scripts/next-release-tag.sh)
            git tag -a "$tag" "$TESTED_SHA" -m "Silicon $tag"
            if git push origin "refs/tags/$tag"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -d "$tag"
            sleep "$attempts"
          done
          echo 'Could not allocate a release tag after five serialized attempts' >&2
          exit 1

  publish-release:
    needs: auto-tag
    if: needs.auto-tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
      sha: ${{ github.sha }}
