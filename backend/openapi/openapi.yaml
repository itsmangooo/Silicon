openapi: 3.1.0
info:
  title: Silicon Platform API
  version: 0.6.0
  description: >-
    Silicon platform API with local authentication, organization-scoped
    records, GitHub push automation, Cloudflare DNS/tunnel integration, and a
    local, SSH-connected, and AWS-backed Docker runtime providers, plus AWS
    infrastructure inventory, cost reporting, and budgets.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Authentication
  - name: Organizations
  - name: Projects
  - name: Environments
  - name: Applications
  - name: Deployments
  - name: Configuration
  - name: Servers
  - name: Networks
  - name: Identity
  - name: Audit
  - name: GitHub
  - name: Cloudflare
  - name: Domains
  - name: Runtime
  - name: Secrets
  - name: AWS
  - name: Costs
  - name: Budgets
  - name: System
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a local user and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '201':
          description: Registered
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/ConflictError'}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a local session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a single-use password recovery link
      description: Always returns the same accepted response for syntactically valid known and unknown accounts. Requests are rate limited and delivery is asynchronous.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}
      responses:
        '202': {description: Generic request result, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResult'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /auth/password-reset/complete:
    post:
      tags: [Authentication]
      summary: Consume a password recovery token and revoke existing sessions
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetComplete'}}}
      responses:
        '200': {description: Password updated, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResult'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/session:
    get:
      tags: [Authentication]
      summary: Inspect the active session
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: '#/components/schemas/User'}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /system/version:
    get:
      tags: [System]
      summary: Read the installed Silicon version and commit
      responses:
        '200': {description: Installed build, content: {application/json: {schema: {$ref: '#/components/schemas/SystemVersion'}}}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /system/updates:
    get:
      tags: [System]
      summary: Read cached stable release information and the latest durable update operation
      responses:
        '200': {description: Update state, content: {application/json: {schema: {$ref: '#/components/schemas/SystemUpdateStatus'}}}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
    post:
      tags: [System]
      summary: Queue an exact tagged Silicon release update
      description: Requires an installation-level system administrator. Organization roles do not grant this capability.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SystemUpdateInput'}}}
      responses:
        '202': {description: Durable update operation, content: {application/json: {schema: {$ref: '#/components/schemas/SystemUpdate'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /system/updates/check:
    post:
      tags: [System]
      summary: Refresh GitHub stable release discovery
      description: Requires an installation-level system administrator.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200': {description: Refreshed update state, content: {application/json: {schema: {$ref: '#/components/schemas/SystemUpdateStatus'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /system/public-access:
    get:
      tags: [System]
      summary: Read installation public access state and eligible Cloudflare resources
      description: Requires an installation-level system administrator.
      responses:
        '200': {description: Public access state, content: {application/json: {schema: {$ref: '#/components/schemas/SystemPublicAccessStatus'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
    post:
      tags: [System]
      summary: Queue installation public access through a local Cloudflare Tunnel
      description: Uses organization-owned Cloudflare resources without transferring ownership.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SystemPublicAccessInput'}}}
      responses:
        '202': {description: Durable operation, content: {application/json: {schema: {$ref: '#/components/schemas/SystemPublicAccessOperation'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '409': {$ref: '#/components/responses/ConflictError'}
    delete:
      tags: [System]
      summary: Disable installation public access and restore the previous local settings
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '202': {description: Durable operation, content: {application/json: {schema: {$ref: '#/components/schemas/SystemPublicAccessOperation'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '409': {$ref: '#/components/responses/ConflictError'}
  /system/email:
    get:
      tags: [System]
      summary: Read installation email configuration and delivery health
      description: Installation administrator only. Stored credentials are never returned.
      responses:
        '200': {description: System email state, content: {application/json: {schema: {$ref: '#/components/schemas/SystemMailStatus'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
    put:
      tags: [System]
      summary: Create or update the installation email provider
      description: Installation administrator only. Credentials are write-only and encrypted at rest.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SystemMailInput'}}}
      responses:
        '200': {description: Saved configuration, content: {application/json: {schema: {type: object, properties: {configuration: {$ref: '#/components/schemas/SystemMailConfiguration'}}}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /system/email/test:
    post:
      tags: [System]
      summary: Queue a real provider test message
      description: Installation administrator only. Delivery is processed by the durable mail worker.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [recipient], properties: {recipient: {type: string, format: email}}}}}
      responses:
        '202': {description: Test message queued}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the active session
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Logged out}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations for the current user
      responses:
        '200':
          description: Organization memberships
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations: {type: array, items: {$ref: '#/components/schemas/Organization'}}
    post:
      tags: [Organizations]
      summary: Create an organization and owner membership
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NamedSlugInput'}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{organizationID}/access:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      summary: Return current role and permissions
      responses:
        '200':
          description: Access policy result
          content:
            application/json:
              schema:
                type: object
                required: [role, permissions]
                properties:
                  role: {$ref: '#/components/schemas/Role'}
                  permissions: {type: array, items: {type: string}}
        '404': {$ref: '#/components/responses/NotFoundError'}
  /organizations/{organizationID}/search:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      summary: Search resources in the active organization
      description: Searches non-secret organization data. Member and budget results are omitted when the active role lacks their read permissions.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: Organization-scoped results
          content:
            application/json:
              schema:
                type: object
                required: [query, results]
                properties:
                  query: {type: string}
                  results: {type: array, items: {$ref: '#/components/schemas/SearchResult'}}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{organizationID}/members:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      summary: List organization members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties: {members: {type: array, items: {$ref: '#/components/schemas/Member'}}}
    post:
      tags: [Organizations]
      summary: Add an existing local user as a member
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '201': {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Projects]
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema: {type: object, properties: {projects: {type: array, items: {$ref: '#/components/schemas/Project'}}}}
    post:
      tags: [Projects]
      summary: Create a project
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects/{projectID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: Get a project
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFoundError'}
    put:
      tags: [Projects]
      summary: Update a project
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
    delete:
      tags: [Projects]
      summary: Delete a project and contained records
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects/{projectID}/environments:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: List project environments
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema: {type: object, properties: {environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}}}
    post:
      tags: [Projects]
      summary: Create an environment
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NamedSlugInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
  /organizations/{organizationID}/environments/{environmentID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/EnvironmentID'}]
    get:
      tags: [Environments]
      summary: Get an environment
      responses:
        '200': {description: Environment, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
        '404': {$ref: '#/components/responses/NotFoundError'}
    put:
      tags: [Environments]
      summary: Update an environment
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NamedSlugInput'}}}}
      responses:
        '200': {description: Updated environment, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
    delete:
      tags: [Environments]
      summary: Delete an empty environment
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Deleted}
        '409': {$ref: '#/components/responses/ConflictError'}
  /organizations/{organizationID}/projects/{projectID}/environment-variables:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ProjectID'}]
    get:
      tags: [Configuration]
      summary: List project variable defaults
      responses:
        '200': {$ref: '#/components/responses/EnvironmentVariables'}
    put:
      tags: [Configuration]
      summary: Replace project variable defaults
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/EnvironmentVariables'}
      responses:
        '200': {description: Variables replaced}
  /organizations/{organizationID}/projects/{projectID}/environment-variables/parse:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ProjectID'}]
    post:
      tags: [Configuration]
      summary: Parse and preview dotenv input for a project
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/DotEnv'}
      responses:
        '200': {$ref: '#/components/responses/DotEnvPreview'}
  /organizations/{organizationID}/environments/{environmentID}/environment-variables:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/EnvironmentID'}]
    get:
      tags: [Configuration]
      summary: List environment variable overrides
      responses:
        '200': {$ref: '#/components/responses/EnvironmentVariables'}
    put:
      tags: [Configuration]
      summary: Replace environment variable overrides
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/EnvironmentVariables'}
      responses:
        '200': {description: Variables replaced}
  /organizations/{organizationID}/environments/{environmentID}/environment-variables/parse:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/EnvironmentID'}]
    post:
      tags: [Configuration]
      summary: Parse and preview dotenv input for an environment
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/DotEnv'}
      responses:
        '200': {$ref: '#/components/responses/DotEnvPreview'}
  /organizations/{organizationID}/applications:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Applications]
      summary: List all organization applications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {type: object, properties: {applications: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}}}
  /organizations/{organizationID}/environments/{environmentID}/applications:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/EnvironmentID'}
    get:
      tags: [Applications]
      summary: List environment applications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {type: object, properties: {applications: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}}}
    post:
      tags: [Applications]
      summary: Create an application record
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
  /organizations/{organizationID}/applications/{applicationID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ApplicationID'}]
    get:
      tags: [Applications]
      summary: Get an application
      responses:
        '200': {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
    put:
      tags: [Applications]
      summary: Update an application
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationInput'}}}}
      responses:
        '200': {description: Updated application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
    delete:
      tags: [Applications]
      summary: Delete an application and its dependent Silicon records
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Deleted}
  /organizations/{organizationID}/deployments:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Deployments]
      summary: List recent organization deployments
      responses:
        '200': {description: Deployments, content: {application/json: {schema: {type: object, properties: {deployments: {type: array, items: {$ref: '#/components/schemas/Deployment'}}}}}}}
  /organizations/{organizationID}/applications/{applicationID}/deployments:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Deployments]
      summary: List application deployments
      responses:
        '200': {description: Deployments, content: {application/json: {schema: {type: object, properties: {deployments: {type: array, items: {$ref: '#/components/schemas/Deployment'}}}}}}}
    post:
      tags: [Deployments]
      summary: Queue a deployment for the configured runtime provider
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentInput'}}}}
      responses:
        '201': {description: Queued deployment, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
  /organizations/{organizationID}/applications/{applicationID}/environment-variables:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Applications]
      summary: List ordinary application environment variables
      responses:
        '200': {description: Variables, content: {application/json: {schema: {type: object, properties: {variables: {type: array, items: {$ref: '#/components/schemas/EnvironmentVariable'}}}}}}}
    put:
      tags: [Applications]
      summary: Replace ordinary application environment variables
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties: {variables: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/EnvironmentVariableInput'}}}
      responses:
        '200': {description: Variables replaced}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{organizationID}/applications/{applicationID}/environment-variables/parse:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ApplicationID'}]
    post:
      tags: [Configuration]
      summary: Parse and preview dotenv input for an application
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/DotEnv'}
      responses:
        '200': {$ref: '#/components/responses/DotEnvPreview'}
  /organizations/{organizationID}/applications/{applicationID}/configuration:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ApplicationID'}]
    get:
      tags: [Configuration]
      summary: Resolve effective application variables and secret metadata
      description: Application values override environment values, which override project defaults. Secret plaintext is never returned.
      responses:
        '200': {description: Effective configuration, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveConfiguration'}}}}
  /organizations/{organizationID}/projects/{projectID}/secrets:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ProjectID'}]
    get:
      tags: [Secrets]
      summary: List project secret metadata
      responses:
        '200': {description: Secret metadata, content: {application/json: {schema: {type: object, properties: {secrets: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}}}}}}
  /organizations/{organizationID}/projects/{projectID}/secrets/{secret}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ProjectID'}, {name: secret, in: path, required: true, schema: {type: string}}]
    put:
      tags: [Secrets]
      summary: Create or rotate a project secret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/SecretValue'}
      responses: {'200': {description: Stored}}
    delete:
      tags: [Secrets]
      summary: Delete a project secret by ID
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Deleted}}
  /organizations/{organizationID}/environments/{environmentID}/secrets:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/EnvironmentID'}]
    get:
      tags: [Secrets]
      summary: List environment secret metadata
      responses:
        '200': {description: Secret metadata, content: {application/json: {schema: {type: object, properties: {secrets: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}}}}}}
  /organizations/{organizationID}/environments/{environmentID}/secrets/{secret}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/EnvironmentID'}, {name: secret, in: path, required: true, schema: {type: string}}]
    put:
      tags: [Secrets]
      summary: Create or rotate an environment secret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/SecretValue'}
      responses: {'200': {description: Stored}}
    delete:
      tags: [Secrets]
      summary: Delete an environment secret by ID
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Deleted}}
  /organizations/{organizationID}/applications/{applicationID}/secrets:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Secrets]
      summary: List write-only secret metadata
      responses:
        '200': {description: Secret metadata, content: {application/json: {schema: {type: object, properties: {secrets: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}}}}}}
  /organizations/{organizationID}/applications/{applicationID}/secrets/{secret}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
      - {name: secret, in: path, required: true, description: Environment-style name for PUT or UUID for DELETE, schema: {type: string}}
    put:
      tags: [Secrets]
      summary: Create or rotate an encrypted local secret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
