        organizationId: {$ref: '#/components/schemas/UUID'}
        accountId: {$ref: '#/components/schemas/UUID'}
        operationType: {type: string, enum: [provision_machine, terminate_machine, create_snapshot, prepare_machine]}
        status: {type: string, enum: [queued, running, waiting_for_aws, waiting_for_connection, succeeded, failed]}
        resourceType: {type: string}
        providerResourceId: {type: string}
        error: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    BudgetInput:
      type: object
      additionalProperties: false
