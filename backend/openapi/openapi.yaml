openapi: 3.1.0
info:
  title: Silicon Control Plane API
  version: 0.5.0
  description: >-
    Silicon control-plane API with local authentication, organization-scoped
    records, GitHub push automation, Cloudflare DNS/tunnel integration, and a
    local and SSH-connected Docker runtime providers.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Authentication
  - name: Organizations
  - name: Projects
  - name: Applications
  - name: Deployments
  - name: Servers
  - name: Identity
  - name: Audit
  - name: GitHub
  - name: Cloudflare
  - name: Domains
  - name: Runtime
  - name: Secrets
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a local user and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '201':
          description: Registered
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/ConflictError'}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a local session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /auth/session:
    get:
      tags: [Authentication]
      summary: Inspect the active session
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: '#/components/schemas/User'}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the active session
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Logged out}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations for the current user
      responses:
        '200':
          description: Organization memberships
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations: {type: array, items: {$ref: '#/components/schemas/Organization'}}
    post:
      tags: [Organizations]
      summary: Create an organization and owner membership
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NamedSlugInput'}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{organizationID}/access:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      summary: Return current role and permissions
      responses:
        '200':
          description: Access policy result
          content:
            application/json:
              schema:
                type: object
                required: [role, permissions]
                properties:
                  role: {$ref: '#/components/schemas/Role'}
                  permissions: {type: array, items: {type: string}}
        '404': {$ref: '#/components/responses/NotFoundError'}
  /organizations/{organizationID}/members:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Organizations]
      summary: List organization members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties: {members: {type: array, items: {$ref: '#/components/schemas/Member'}}}
    post:
      tags: [Organizations]
      summary: Add an existing local user as a member
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '201': {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Projects]
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema: {type: object, properties: {projects: {type: array, items: {$ref: '#/components/schemas/Project'}}}}
    post:
      tags: [Projects]
      summary: Create a project
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects/{projectID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: Get a project
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFoundError'}
    put:
      tags: [Projects]
      summary: Update a project
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '403': {$ref: '#/components/responses/ForbiddenError'}
    delete:
      tags: [Projects]
      summary: Delete a project and contained records
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/ForbiddenError'}
  /organizations/{organizationID}/projects/{projectID}/environments:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ProjectID'}
    get:
      tags: [Projects]
      summary: List project environments
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema: {type: object, properties: {environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}}}
    post:
      tags: [Projects]
      summary: Create an environment
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NamedSlugInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
  /organizations/{organizationID}/applications:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Applications]
      summary: List all organization applications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {type: object, properties: {applications: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}}}
  /organizations/{organizationID}/environments/{environmentID}/applications:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/EnvironmentID'}
    get:
      tags: [Applications]
      summary: List environment applications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {type: object, properties: {applications: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}}}
    post:
      tags: [Applications]
      summary: Create an application record
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
  /organizations/{organizationID}/deployments:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Deployments]
      summary: List recent organization deployments
      responses:
        '200': {description: Deployments, content: {application/json: {schema: {type: object, properties: {deployments: {type: array, items: {$ref: '#/components/schemas/Deployment'}}}}}}}
  /organizations/{organizationID}/applications/{applicationID}/deployments:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Deployments]
      summary: List application deployments
      responses:
        '200': {description: Deployments, content: {application/json: {schema: {type: object, properties: {deployments: {type: array, items: {$ref: '#/components/schemas/Deployment'}}}}}}}
    post:
      tags: [Deployments]
      summary: Queue a deployment for the configured runtime provider
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentInput'}}}}
      responses:
        '201': {description: Queued deployment, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
  /organizations/{organizationID}/applications/{applicationID}/environment-variables:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Applications]
      summary: List ordinary application environment variables
      responses:
        '200': {description: Variables, content: {application/json: {schema: {type: object, properties: {variables: {type: array, items: {$ref: '#/components/schemas/EnvironmentVariable'}}}}}}}
    put:
      tags: [Applications]
      summary: Replace ordinary application environment variables
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties: {variables: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/EnvironmentVariableInput'}}}
      responses:
        '200': {description: Variables replaced}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{organizationID}/applications/{applicationID}/secrets:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Secrets]
      summary: List write-only secret metadata
      responses:
        '200': {description: Secret metadata, content: {application/json: {schema: {type: object, properties: {secrets: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}}}}}}
  /organizations/{organizationID}/applications/{applicationID}/secrets/{secret}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
      - {name: secret, in: path, required: true, description: Environment-style name for PUT or UUID for DELETE, schema: {type: string}}
    put:
      tags: [Secrets]
      summary: Create or rotate an encrypted local secret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [value], properties: {value: {type: string, writeOnly: true, maxLength: 65536}}}}}}
      responses:
        '200': {description: Secret stored; plaintext is never returned}
        '503': {description: Encryption key unavailable}
    delete:
      tags: [Secrets]
      summary: Delete an application secret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Deleted}
  /organizations/{organizationID}/applications/{applicationID}/runtime:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    get:
      tags: [Runtime]
      summary: Inspect the current persisted instance and refresh it from Docker
      responses:
        '200': {description: Current runtime, content: {application/json: {schema: {type: object, properties: {instance: {oneOf: [{$ref: '#/components/schemas/RuntimeInstance'}, {type: 'null'}]}, providerAvailable: {type: boolean}, providerError: {type: string}}}}}}
  /organizations/{organizationID}/applications/{applicationID}/runtime/{action}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
      - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop, restart, remove]}}
    post:
      tags: [Runtime]
      summary: Apply a lifecycle action to the current Silicon-managed instance
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200': {description: Updated runtime, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeInstance'}}}}
        '503': {description: Runtime provider unavailable}
  /organizations/{organizationID}/applications/{applicationID}/runtime/logs:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
      - {name: tail, in: query, schema: {type: integer, minimum: 0, maximum: 1000, default: 200}}
      - {name: follow, in: query, schema: {type: boolean, default: false}}
      - {name: since, in: query, schema: {type: string, format: date-time}}
    get:
      tags: [Runtime]
      summary: Read bounded historical logs or follow them using server-sent events
      responses:
        '200':
          description: JSON log lines when follow is false; text/event-stream when true
          content:
            application/json: {schema: {type: object, properties: {logs: {type: array, items: {$ref: '#/components/schemas/RuntimeLogLine'}}}}}
            text/event-stream: {schema: {type: string}}
  /organizations/{organizationID}/deployments/{deploymentID}/transitions:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/DeploymentID'}
    post:
      tags: [Deployments]
      summary: Apply an allowed deployment state transition
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/DeploymentStatus'}
                message: {type: string, maxLength: 2000}
      responses:
        '200': {description: Transitioned, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
        '409': {$ref: '#/components/responses/ConflictError'}
  /organizations/{organizationID}/servers:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Servers]
      summary: List server inventory records
      responses:
        '200': {description: Servers, content: {application/json: {schema: {type: object, properties: {servers: {type: array, items: {$ref: '#/components/schemas/Server'}}}}}}}
    post:
      tags: [Servers]
      summary: Register a server inventory record
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerInput'}}}}
      responses:
        '201': {description: Server connection record created, content: {application/json: {schema: {$ref: '#/components/schemas/Server'}}}}
  /organizations/{organizationID}/servers/{serverID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Servers]
      summary: Read the most recent active server connection check
      responses: {'200': {description: Server, content: {application/json: {schema: {$ref: '#/components/schemas/Server'}}}}}
  /organizations/{organizationID}/servers/{serverID}/connection:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Servers]
      summary: Replace local or SSH connection configuration
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerConnectionInput'}}}}
      responses: {'200': {description: Connection updated, content: {application/json: {schema: {$ref: '#/components/schemas/Server'}}}}}
  /organizations/{organizationID}/servers/{serverID}/check:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Servers]
      summary: Actively verify reachability, host identity, and Docker
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'200': {description: Connection verified}, '409': {description: SSH host key requires explicit trust or changed unexpectedly}, '422': {description: Authentication or Docker check failed}}
  /organizations/{organizationID}/servers/{serverID}/trust-host-key:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Servers]
      summary: Explicitly trust the exact SSH host-key fingerprint currently presented
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [fingerprint], properties: {fingerprint: {type: string, pattern: '^SHA256:'}}}}}}
      responses: {'200': {description: Host identity trusted and checked}, '422': {description: Fingerprint verification failed}}
  /organizations/{organizationID}/applications/{applicationID}/server:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/ApplicationID'}
    put:
      tags: [Applications]
      summary: Select an organization-owned deployment target, or null for local
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {serverId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}}}}}}
      responses: {'200': {description: Updated application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}}
  /organizations/{organizationID}/identity-providers:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Identity]
      summary: List disabled/active identity-provider records
      responses:
        '200': {description: Providers, content: {application/json: {schema: {type: object, properties: {identityProviders: {type: array, items: {$ref: '#/components/schemas/IdentityProvider'}}}}}}}
    post:
      tags: [Identity]
      summary: Add disabled OIDC configuration metadata
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IdentityProviderInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/IdentityProvider'}}}}
  /organizations/{organizationID}/audit-events:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Audit]
      summary: List recent organization audit events
      responses:
        '200': {description: Events, content: {application/json: {schema: {type: object, properties: {auditEvents: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}}}}}}
  /webhooks/github:
    post:
      tags: [GitHub]
      summary: Accept a signed GitHub App webhook
      security: []
      parameters:
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Verified push accepted or safely ignored}
        '401': {description: Invalid signature}
        '413': {description: Payload exceeds one MiB}
  /organizations/{organizationID}/integrations/github:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [GitHub], summary: Read GitHub App connection, responses: {'200': {description: Connected installation, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubIntegration'}}}}}}
    post:
      tags: [GitHub]
      summary: Connect or reconnect a GitHub App installation
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [installationId], properties: {installationId: {type: integer, minimum: 1}}}}}}
      responses: {'201': {description: Connected, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubIntegration'}}}}}
    delete: {tags: [GitHub], summary: Disconnect GitHub, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Disconnected}}}
  /organizations/{organizationID}/integrations/github/repositories:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [GitHub], summary: List repositories granted to the installation, responses: {'200': {description: Repositories}}}
  /organizations/{organizationID}/applications/{applicationID}/git-source:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ApplicationID'}]
    get: {tags: [GitHub], summary: Read application Git source, responses: {'200': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/GitSource'}}}}}}
    put:
      tags: [GitHub]
      summary: Select repository, branch, and push automation
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitSourceInput'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/GitSource'}}}}}
  /organizations/{organizationID}/integrations/cloudflare:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [Cloudflare], summary: Read redacted Cloudflare connection, responses: {'200': {description: Connection}}}
    post:
      tags: [Cloudflare]
      summary: Verify and encrypt a scoped API token
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [accountId, apiToken], properties: {accountId: {type: string}, apiToken: {type: string, format: password}}}}}}
      responses: {'201': {description: Connected}}
  /organizations/{organizationID}/integrations/cloudflare/zones:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [Cloudflare], summary: Verify connection and discover zones, responses: {'200': {description: Zones}}}
  /organizations/{organizationID}/integrations/cloudflare/zones/{zoneID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ZoneID'}]
    put: {tags: [Cloudflare], summary: Enable or disable a discovered zone for matching, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Selection updated}}}
  /organizations/{organizationID}/domains:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [Domains], summary: List organization domains and DNS state, responses: {'200': {description: Domains}}}
  /organizations/{organizationID}/applications/{applicationID}/domains:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/ApplicationID'}]
    post:
      tags: [Domains]
      summary: Create and reconcile a Cloudflare DNS record
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DomainInput'}}}}
      responses: {'201': {description: Active managed domain}, '409': {description: Existing unrelated record or missing zone}}
  /organizations/{organizationID}/domains/{domainID}/sync:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/DomainID'}]
    post: {tags: [Domains], summary: Reconcile a Silicon-owned record, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'200': {description: Reconciled}, '409': {description: Ownership conflict}}}
  /organizations/{organizationID}/domains/{domainID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/DomainID'}]
    put: {tags: [Domains], summary: Update and reconcile a Silicon-owned DNS record, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DomainUpdateInput'}}}}, responses: {'200': {description: Updated}, '409': {description: Ownership conflict}}}
    delete: {tags: [Domains], summary: Delete local domain and only a Silicon-owned provider record, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Deleted}}}
  /organizations/{organizationID}/integrations/cloudflare/tunnels:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get: {tags: [Cloudflare], summary: List configured tunnel records, responses: {'200': {description: Tunnels}}}
    post: {tags: [Cloudflare], summary: Create or import an optional tunnel bound to a target server, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TunnelInput'}}}}, responses: {'201': {description: Tunnel configured}}}
  /organizations/{organizationID}/integrations/cloudflare/tunnels/{tunnelID}/install:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TunnelID'}]
    post: {tags: [Cloudflare], summary: Retry official cloudflared installation on the selected server, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'200': {description: Installed}, '409': {description: Tunnel is external or has no installable credential}}}
  /organizations/{organizationID}/integrations/cloudflare/tunnels/{tunnelID}/routes:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/TunnelID'}]
    post: {tags: [Cloudflare], summary: Add a provider-resolved hostname route and reconcile its tunnel CNAME, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [domainId], properties: {domainId: {$ref: '#/components/schemas/UUID'}}}}}}, responses: {'201': {description: Route configured}}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: silicon_session
  parameters:
    CSRFToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: Value of the same-site silicon_csrf cookie}
    OrganizationID: {name: organizationID, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectID: {name: projectID, in: path, required: true, schema: {type: string, format: uuid}}
    EnvironmentID: {name: environmentID, in: path, required: true, schema: {type: string, format: uuid}}
    ApplicationID: {name: applicationID, in: path, required: true, schema: {type: string, format: uuid}}
    DeploymentID: {name: deploymentID, in: path, required: true, schema: {type: string, format: uuid}}
    DomainID: {name: domainID, in: path, required: true, schema: {type: string, format: uuid}}
    TunnelID: {name: tunnelID, in: path, required: true, schema: {type: string, format: uuid}}
    ZoneID: {name: zoneID, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    AuthenticationError: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ForbiddenError: {description: Permission or CSRF check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFoundError: {description: Resource or membership not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Input validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ConflictError: {description: Uniqueness or state conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    Role: {type: string, enum: [owner, admin, developer, viewer]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    AuthResult:
      type: object
      required: [user, csrfToken]
      properties: {user: {$ref: '#/components/schemas/User'}, csrfToken: {type: string}}
    User:
      type: object
      required: [id, email, displayName, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string, enum: [active, disabled]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    NamedSlugInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    Member:
      type: object
      properties:
        userId: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ProjectInput:
      allOf:
        - {$ref: '#/components/schemas/NamedSlugInput'}
        - {type: object, properties: {description: {type: string, maxLength: 2000}}}
    Project:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    Environment:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        projectId: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        sourceType: {type: string, enum: [docker_image, git_dockerfile, compose], default: docker_image}
        image: {type: string, maxLength: 500}
        internalPort: {type: integer, minimum: 1, maximum: 65535}
        hostAddress: {type: string, description: Explicit IPv4 or IPv6 bind address; omit to publish no host port}
        publishedPort: {type: integer, minimum: 1, maximum: 65535}
        serverId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
    Application:
      allOf:
        - {$ref: '#/components/schemas/ApplicationInput'}
        - type: object
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            organizationId: {$ref: '#/components/schemas/UUID'}
            projectId: {$ref: '#/components/schemas/UUID'}
            environmentId: {$ref: '#/components/schemas/UUID'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    EnvironmentVariableInput:
      type: object
      additionalProperties: false
      required: [name, value]
      properties: {name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}, value: {type: string, maxLength: 32768}}
    EnvironmentVariable:
      allOf:
        - {$ref: '#/components/schemas/EnvironmentVariableInput'}
        - {type: object, properties: {updatedAt: {$ref: '#/components/schemas/Timestamp'}}}
    SecretMetadata:
      type: object
      properties: {id: {$ref: '#/components/schemas/UUID'}, name: {type: string}, provider: {type: string, enum: [local]}, createdAt: {$ref: '#/components/schemas/Timestamp'}, updatedAt: {$ref: '#/components/schemas/Timestamp'}}
    RuntimeInstance:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        applicationId: {$ref: '#/components/schemas/UUID'}
        deploymentId: {$ref: '#/components/schemas/UUID'}
        provider: {type: string, enum: [docker]}
        serverId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        instanceId: {type: string}
        image: {type: string}
        state: {type: string}
        health: {type: string, enum: [unknown, starting, healthy, unhealthy, running, exited]}
        containerPort: {type: [integer, 'null']}
        hostAddress: {type: [string, 'null']}
        hostPort: {type: [integer, 'null']}
        runtimeCreatedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        runtimeStartedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        runtimeFinishedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        lastInspectedAt: {$ref: '#/components/schemas/Timestamp'}
        removedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    RuntimeLogLine:
      type: object
      properties: {timestamp: {$ref: '#/components/schemas/Timestamp'}, stream: {type: string, enum: [stdout, stderr]}, message: {type: string}}
    DeploymentStatus: {type: string, enum: [queued, preparing, building, deploying, starting, healthy, failed, cancelled, superseded, rolled_back]}
    DeploymentInput:
      type: object
      additionalProperties: false
      properties:
        source: {type: string, maxLength: 500}
        sourceRevision: {type: string, maxLength: 200}
        image: {type: string, maxLength: 500}
    Deployment:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        applicationId: {$ref: '#/components/schemas/UUID'}
        number: {type: integer, minimum: 1}
        source: {type: string}
        sourceRevision: {type: string}
        image: {type: string}
        status: {$ref: '#/components/schemas/DeploymentStatus'}
        triggeredBy: {$ref: '#/components/schemas/UUID'}
        previousDeploymentId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        repository: {type: string}
        branch: {type: string}
        commitSha: {type: string}
        triggerType: {type: string, enum: [manual, github_push, rollback, redeploy]}
        githubDeliveryId: {type: [string, 'null']}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    ServerInput:
      type: object
      additionalProperties: false
      required: [name, connectionType]
      properties:
        name: {type: string}
        connectionType: {type: string, enum: [local, ssh]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        username: {type: string}
        privateKey: {type: string, writeOnly: true, format: password}
        hostKeyFingerprint: {type: string, pattern: '^SHA256:'}
        publicAddress: {type: string}
        connectivityType: {type: string, enum: [public, self_hosted, private], default: public}
    ServerConnectionInput:
      type: object
      additionalProperties: false
      required: [connectionType, host]
      properties:
        connectionType: {type: string, enum: [local, ssh]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        username: {type: string}
        privateKey: {type: string, writeOnly: true, format: password}
        hostKeyFingerprint: {type: string, pattern: '^SHA256:'}
        publicAddress: {type: string}
    Server:
      allOf:
        - {$ref: '#/components/schemas/ServerInput'}
        - type: object
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            organizationId: {$ref: '#/components/schemas/UUID'}
            runtime: {type: string}
            hostname: {type: string}
            operatingSystem: {type: string}
            architecture: {type: string}
            connectionStatus: {type: string, enum: [connection_not_configured, connected, unreachable, docker_unavailable, authentication_failed, host_key_changed]}
            health: {type: string, enum: [unknown, healthy, degraded, unhealthy]}
            connectivityType: {type: string, enum: [public, self_hosted, private]}
            dockerAvailable: {type: boolean}
            dockerVersion: {type: string}
            cpuCapacity: {type: [integer, 'null']}
            cpuUsagePercent: {type: [number, 'null']}
            memoryBytes: {type: [integer, 'null'], format: int64}
            memoryUsedBytes: {type: [integer, 'null'], format: int64}
            diskTotalBytes: {type: [integer, 'null'], format: int64}
            diskUsedBytes: {type: [integer, 'null'], format: int64}
            uptimeSeconds: {type: [integer, 'null'], format: int64}
            connectionType: {type: string, enum: [unconfigured, local, ssh]}
            publicAddress: {type: string}
            sshPort: {type: integer}
            sshUsername: {type: string}
            credentialConfigured: {type: boolean}
            sshHostKeyFingerprint: {type: string}
            connectionError: {type: string}
            lastCheckedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    IdentityProviderInput:
      type: object
      additionalProperties: false
      required: [name, issuerUrl, clientId, callbackUrl]
      properties:
        name: {type: string}
        providerType: {type: string, enum: [oidc, authentik], default: oidc}
        issuerUrl: {type: string, format: uri, pattern: '^https://'}
        clientId: {type: string}
        callbackUrl: {type: string, format: uri}
        scopes: {type: array, items: {type: string}}
    IdentityProvider:
      allOf:
        - {$ref: '#/components/schemas/IdentityProviderInput'}
        - type: object
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            organizationId: {$ref: '#/components/schemas/UUID'}
            enabled: {type: boolean}
            claimMapping: {type: object}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    AuditEvent:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        actorUserId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        actorName: {type: [string, 'null']}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        requestId: {$ref: '#/components/schemas/UUID'}
        metadata: {type: object}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    GitHubIntegration:
      type: object
      properties: {id: {$ref: '#/components/schemas/UUID'}, organizationId: {$ref: '#/components/schemas/UUID'}, installationId: {type: integer}, accountLogin: {type: string}, status: {type: string, enum: [connected, disconnected, error]}}
    GitSourceInput:
      type: object
      additionalProperties: false
      required: [repositoryId, repositoryFullName, branch, autoDeploy]
      properties: {repositoryId: {type: integer}, repositoryFullName: {type: string}, branch: {type: string}, autoDeploy: {type: boolean}}
    GitSource:
      allOf:
        - {$ref: '#/components/schemas/GitSourceInput'}
        - {type: object, properties: {applicationId: {$ref: '#/components/schemas/UUID'}, organizationId: {$ref: '#/components/schemas/UUID'}, provider: {type: string, enum: [github]}}}
    DomainInput:
      type: object
      additionalProperties: false
      required: [hostname, targetPort, protocol, routingMode]
      properties: {hostname: {type: string}, targetPort: {type: integer, minimum: 1, maximum: 65535}, protocol: {type: string, enum: [http, https, tcp]}, routingMode: {type: string, enum: [dns_only, cloudflare_proxied, cloudflare_tunnel]}}
    DomainUpdateInput:
      type: object
      additionalProperties: false
      required: [targetPort, protocol, routingMode]
      properties: {targetPort: {type: integer, minimum: 1, maximum: 65535}, protocol: {type: string, enum: [http, https, tcp]}, routingMode: {type: string, enum: [dns_only, cloudflare_proxied, cloudflare_tunnel]}}
    TunnelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        providerTunnelId: {type: string}
        ownership: {type: string, enum: [imported, external]}
        serverId: {$ref: '#/components/schemas/UUID'}
security:
  - sessionCookie: []
