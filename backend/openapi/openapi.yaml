      properties:
        name: {type: string}
        accountId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        projectId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        environmentId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        monthlyAmount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, default: USD}
        thresholds: {type: array, minItems: 1, items: {type: number, exclusiveMinimum: 0}}
        preventNewProvisioning: {type: boolean, description: Blocks only new Silicon provisioning; never stops or terminates resources}
        providerType: {type: string, enum: [silicon], default: silicon, description: AWS-backed budgets are not created by this milestone}
security:
  - sessionCookie: []
