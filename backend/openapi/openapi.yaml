  /organizations/{organizationID}/aws/accounts/{accountID}/elastic-ips/{resourceID}/associate:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Associate a Silicon-managed Elastic IP to a controlled instance, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [instanceId], properties: {instanceId: {type: string}}}}}}, responses: {'204': {description: Address associated}, '409': {description: Ownership protection}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/elastic-ips/{resourceID}/disassociate:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Disassociate a Silicon-managed Elastic IP, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Address disassociated}, '409': {description: Ownership protection}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/volumes:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Create an encrypted-by-default tagged EBS volume, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AWSVolumeInput'}}}}, responses: {'201': {description: Volume created}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/volumes/{resourceID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    delete: {tags: [AWS], summary: Delete a detached Silicon-managed EBS volume, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Volume deleted}, '409': {description: Ownership or attachment protection}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/volumes/{resourceID}/attach:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Attach a Silicon-managed volume to a controlled instance, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [instanceId, device], properties: {instanceId: {type: string}, device: {type: string}}}}}}, responses: {'204': {description: Attach requested}, '409': {description: Ownership protection}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/volumes/{resourceID}/detach:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Detach a Silicon-managed EBS volume, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Detach requested}, '409': {description: Ownership protection}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/snapshots:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSRegion'}]
    post: {tags: [AWS], summary: Snapshot a Silicon-managed EBS volume, parameters: [{$ref: '#/components/parameters/CSRFToken'}], requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [volumeId], properties: {volumeId: {type: string}, description: {type: string}}}}}}, responses: {'201': {description: Snapshot created}}}
  /organizations/{organizationID}/aws/accounts/{accountID}/snapshots/{resourceID}:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}, {$ref: '#/components/parameters/AWSAccountID'}, {$ref: '#/components/parameters/AWSResourceID'}, {$ref: '#/components/parameters/AWSRegion'}]
    delete: {tags: [AWS], summary: Delete a Silicon-managed snapshot, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'204': {description: Snapshot deleted}, '409': {description: Ownership protection}}}
  /organizations/{organizationID}/aws/operations:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [AWS]
      summary: List asynchronous AWS infrastructure operations
      responses: {'200': {description: Operations, content: {application/json: {schema: {type: object, properties: {operations: {type: array, items: {$ref: '#/components/schemas/AWSOperation'}}}}}}}}
  /organizations/{organizationID}/aws/costs:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: accountId, in: query, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Costs]
      summary: Read delayed actual current-month AWS Cost Explorer data
      responses: {'200': {description: Actual billing report, content: {application/json: {schema: {$ref: '#/components/schemas/AWSCostReport'}}}}, '502': {description: Billing API unavailable or denied}}
  /organizations/{organizationID}/budgets:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Budgets]
      summary: List Silicon budget policies
      responses: {'200': {description: Budgets}}
    post:
      tags: [Budgets]
      summary: Create a non-destructive budget policy
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetInput'}}}}
      responses: {'201': {description: Created budget}}
  /organizations/{organizationID}/budgets/{budgetID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: budgetID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete:
      tags: [Budgets]
      summary: Delete a Silicon budget policy
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Deleted}}
  /organizations/{organizationID}/networks:
    parameters: [{$ref: '#/components/parameters/OrganizationID'}]
    get:
      tags: [Networks]
      summary: List organization-private networks
      responses: {'200': {description: Private networks}}
    post:
      tags: [Networks]
      summary: Create a WireGuard network and queue reconciliation
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, cidr, hubServerId]
              properties:
                name: {type: string, maxLength: 120}
                cidr: {type: string, example: 10.44.0.0/24}
                hubServerId: {$ref: '#/components/schemas/UUID'}
                listenPort: {type: integer, minimum: 1, maximum: 65535, default: 51820}
      responses: {'201': {description: Network and queued operation}, '409': {$ref: '#/components/responses/ConflictError'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /organizations/{organizationID}/networks/{networkID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get: {tags: [Networks], summary: Read network members services policies and operations, responses: {'200': {description: Network detail}, '404': {$ref: '#/components/responses/NotFoundError'}}}
    delete: {tags: [Networks], summary: Queue ownership-safe network teardown after services are detached, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'202': {description: Network deletion queued}, '409': {$ref: '#/components/responses/ConflictError'}}}
  /organizations/{organizationID}/networks/{networkID}/members:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Networks]
      summary: Allocate an overlay address and queue a server membership reconciliation
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [serverId], properties: {serverId: {$ref: '#/components/schemas/UUID'}}}}}}
      responses: {'201': {description: Network member and queued operation}, '409': {$ref: '#/components/responses/ConflictError'}}
  /organizations/{organizationID}/networks/{networkID}/members/{memberID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: memberID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete: {tags: [Networks], summary: Queue safe removal of a non-hub network member, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'202': {description: Removal queued}, '409': {$ref: '#/components/responses/ConflictError'}}}
  /organizations/{organizationID}/networks/{networkID}/services:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Networks]
      summary: Attach an application service to private discovery and routing
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [applicationId, port], properties: {applicationId: {$ref: '#/components/schemas/UUID'}, hostname: {type: string, example: backend.production.shop.internal}, protocol: {type: string, enum: [tcp, udp], default: tcp}, port: {type: integer, minimum: 1, maximum: 65535}}}}}}
      responses: {'201': {description: Service attachment and queued operation}, '422': {$ref: '#/components/responses/ValidationError'}}
  /organizations/{organizationID}/networks/{networkID}/services/{serviceID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: serviceID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete: {tags: [Networks], summary: Detach a private application service and reconcile, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'202': {description: Detachment accepted}}}
  /organizations/{organizationID}/networks/{networkID}/policies:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Networks]
      summary: Add an explicit application-to-service private network policy
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [name, sourceApplicationId, destinationServiceId, protocol, port, action], properties: {name: {type: string}, sourceApplicationId: {$ref: '#/components/schemas/UUID'}, destinationServiceId: {$ref: '#/components/schemas/UUID'}, protocol: {type: string, enum: [tcp, udp]}, port: {type: integer, minimum: 1, maximum: 65535}, action: {type: string, enum: [allow, deny]}}}}}}
      responses: {'201': {description: Policy and queued operation}, '422': {$ref: '#/components/responses/ValidationError'}}
  /organizations/{organizationID}/networks/{networkID}/policies/{policyID}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: policyID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete: {tags: [Networks], summary: Delete a private network policy and reconcile, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'202': {description: Deletion accepted}}}
  /organizations/{organizationID}/networks/{networkID}/reconcile:
    parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {name: networkID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post: {tags: [Networks], summary: Queue idempotent desired-state reconciliation, parameters: [{$ref: '#/components/parameters/CSRFToken'}], responses: {'202': {description: Reconciliation queued}}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: silicon_session
  parameters:
    CSRFToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: Value of the same-site silicon_csrf cookie}
    OrganizationID: {name: organizationID, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectID: {name: projectID, in: path, required: true, schema: {type: string, format: uuid}}
    EnvironmentID: {name: environmentID, in: path, required: true, schema: {type: string, format: uuid}}
    ApplicationID: {name: applicationID, in: path, required: true, schema: {type: string, format: uuid}}
    DeploymentID: {name: deploymentID, in: path, required: true, schema: {type: string, format: uuid}}
    DomainID: {name: domainID, in: path, required: true, schema: {type: string, format: uuid}}
    TunnelID: {name: tunnelID, in: path, required: true, schema: {type: string, format: uuid}}
    ZoneID: {name: zoneID, in: path, required: true, schema: {type: string, format: uuid}}
    AWSAccountID: {name: accountID, in: path, required: true, schema: {type: string, format: uuid}}
    AWSRegion: {name: region, in: query, required: true, schema: {type: string}}
    AWSResourceID: {name: resourceID, in: path, required: true, schema: {type: string}}
  requestBodies:
    EnvironmentVariables:
      required: true
      content:
        application/json:
          schema: {type: object, required: [variables], properties: {variables: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/EnvironmentVariableInput'}}}}
    DotEnv:
      required: true
      content:
        application/json:
          schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 1048576}}}
    SecretValue:
      required: true
      content:
        application/json:
          schema: {type: object, required: [value], properties: {value: {type: string, writeOnly: true, maxLength: 65536}}}
  responses:
    EnvironmentVariables:
      description: Scoped environment variables
      content: {application/json: {schema: {type: object, properties: {variables: {type: array, items: {$ref: '#/components/schemas/EnvironmentVariable'}}}}}}
    DotEnvPreview:
      description: Parsed values with secret-name suggestions
      content: {application/json: {schema: {type: object, properties: {variables: {type: array, items: {$ref: '#/components/schemas/DotEnvEntry'}}}}}}
    AuthenticationError: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ForbiddenError: {description: Permission or CSRF check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFoundError: {description: Resource or membership not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Input validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ConflictError: {description: Uniqueness or state conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    Role: {type: string, enum: [owner, admin, developer, viewer]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, format: password}}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, format: email, maxLength: 320}}
    PasswordResetComplete:
      type: object
      additionalProperties: false
      required: [token, password, confirmPassword]
      properties:
        token: {type: string, writeOnly: true, format: password}
        password: {type: string, writeOnly: true, format: password, minLength: 12, maxLength: 1024}
        confirmPassword: {type: string, writeOnly: true, format: password, minLength: 12, maxLength: 1024}
    MessageResult:
      type: object
      required: [message]
      properties: {message: {type: string}}
    AuthResult:
      type: object
      required: [user, csrfToken]
      properties: {user: {$ref: '#/components/schemas/User'}, csrfToken: {type: string}}
    User:
      type: object
      required: [id, email, displayName, status, isSystemAdmin, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string, enum: [active, disabled]}
        isSystemAdmin: {type: boolean, description: Installation-level update administration; independent of organization roles}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    SystemVersion:
      type: object
      required: [version, commitSha, buildTime]
      properties:
        version: {type: string, description: Exact vX.Y.Z tag for production releases; dev for untagged development builds}
        commitSha: {type: string}
        buildTime: {type: string}
    StableRelease:
      type: object
      required: [tagName, name, notes, htmlUrl, publishedAt]
      properties:
        tagName: {type: string, pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
        name: {type: string}
        notes: {type: string}
        htmlUrl: {type: string, format: uri}
        publishedAt: {$ref: '#/components/schemas/Timestamp'}
    SystemUpdate:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        requestedBy: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        fromVersion: {type: string}
        targetVersion: {type: string}
        status: {type: string, enum: [queued, checking, preparing, updating, migrating, restarting, waiting_for_health, completed, failed]}
        message: {type: string}
        releaseNotes: {type: string}
        startedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        completedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SystemUpdateStatus:
      type: object
      required: [version, releaseCheckStatus]
      properties:
        version:
          type: object
          required: [currentVersion, commitSha, buildTime, updateAvailable, checkedAt]
          properties:
            currentVersion: {type: string}
            commitSha: {type: string}
            buildTime: {type: string}
            latestRelease: {oneOf: [{$ref: '#/components/schemas/StableRelease'}, {type: 'null'}]}
            updateAvailable: {type: boolean}
            checkedAt: {$ref: '#/components/schemas/Timestamp'}
        operation: {$ref: '#/components/schemas/SystemUpdate'}
        releaseCheckStatus: {type: string, enum: [available, none, error], description: Distinguishes a discovered release, an empty stable release channel, and a failed GitHub request}
        releaseCheckError: {type: string}
    SystemUpdateInput:
      type: object
      additionalProperties: false
      required: [targetVersion]
      properties:
        targetVersion: {type: string, pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
    SystemMailSettings:
      type: object
      additionalProperties: false
      properties:
        mailgunDomain: {type: string}
        mailgunRegion: {type: string, enum: [us, eu]}
        sesRegion: {type: string}
        smtpPreset: {type: string, enum: [billionmail, stalwart, mailcow, postal, generic]}
        smtpHost: {type: string}
        smtpPort: {type: integer, minimum: 1, maximum: 65535}
        smtpUsername: {type: string}
        smtpEncryption: {type: string, enum: [starttls, tls, none]}
    SystemMailInput:
      type: object
      additionalProperties: false
      required: [provider, fromName, fromAddress, settings]
      properties:
        provider: {type: string, enum: [resend, postmark, mailgun, ses, smtp]}
        fromName: {type: string, minLength: 1, maxLength: 120}
        fromAddress: {type: string, format: email}
        replyTo: {type: string, format: email}
        settings: {$ref: '#/components/schemas/SystemMailSettings'}
        accessKeyId: {type: string, writeOnly: true, description: Amazon SES access key ID; encrypted with the other provider credentials}
        credential: {type: string, writeOnly: true, format: password, description: Required for hosted providers and authenticated SMTP; omit while editing to retain the current provider credential}
        sessionToken: {type: string, writeOnly: true, format: password}
    SystemMailConfiguration:
      type: object
      required: [id, provider, fromName, fromAddress, settings, credentialConfigured, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        provider: {type: string, enum: [resend, postmark, mailgun, ses, smtp]}
        fromName: {type: string}
        fromAddress: {type: string, format: email}
        replyTo: {type: string, format: email}
        settings: {$ref: '#/components/schemas/SystemMailSettings'}
        credentialConfigured: {type: boolean}
        status: {type: string, enum: [not_tested, healthy, failed]}
        lastError: {type: string, description: Sanitized provider health error}
        lastSuccessAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        lastFailureAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SystemMailStatus:
      type: object
      required: [configured]
      properties:
        configured: {type: boolean}
        configuration: {$ref: '#/components/schemas/SystemMailConfiguration'}
    SystemPublicAccessInput:
      type: object
      additionalProperties: false
      required: [organizationId, integrationId, zoneId, tunnelId, hostname]
      properties:
        organizationId: {$ref: '#/components/schemas/UUID'}
        integrationId: {$ref: '#/components/schemas/UUID'}
        zoneId: {$ref: '#/components/schemas/UUID'}
        tunnelId: {$ref: '#/components/schemas/UUID'}
        hostname: {type: string, format: hostname}
    SystemPublicAccessOperation:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        action: {type: string, enum: [configure, disable]}
        status: {type: string, enum: [pending, validating, configuring_cloudflare, updating_configuration, restarting, waiting_for_health, active, disabled, failed]}
        hostname: {type: string}
        localOrigin: {type: string, format: uri}
        message: {type: string}
        failedStage: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SystemPublicAccessStatus:
      type: object
      required: [connections, installation]
      properties:
        active: {oneOf: [{$ref: '#/components/schemas/SystemPublicAccess'}, {type: 'null'}]}
        operation: {oneOf: [{$ref: '#/components/schemas/SystemPublicAccessOperation'}, {type: 'null'}]}
        connections: {type: array, items: {type: object}}
        installation:
          type: object
          properties:
            publicUrl: {type: string, format: uri}
            httpPort: {type: integer, minimum: 1, maximum: 65535}
            bindAddress: {type: string}
            localOrigin: {type: string, format: uri}
    SystemPublicAccess:
      type: object
      properties:
        organizationId: {$ref: '#/components/schemas/UUID'}
        integrationId: {$ref: '#/components/schemas/UUID'}
        zoneId: {$ref: '#/components/schemas/UUID'}
        tunnelId: {$ref: '#/components/schemas/UUID'}
        hostname: {type: string, format: hostname}
        localOrigin: {type: string, format: uri}
        publicUrl: {type: string, format: uri}
        localAccessUrl: {type: string, format: uri}
    NamedSlugInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    Member:
      type: object
      properties:
        userId: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    SearchResult:
      type: object
      additionalProperties: false
      required: [id, type, title, subtitle, route]
      properties:
        id: {type: string}
        type: {type: string, enum: [project, environment, application, deployment, server, domain, aws_account, aws_instance, budget, member]}
        title: {type: string}
        subtitle: {type: string}
        route: {type: string}
        status: {type: string}
    ProjectInput:
      allOf:
        - {$ref: '#/components/schemas/NamedSlugInput'}
        - {type: object, properties: {description: {type: string, maxLength: 2000}}}
    Project:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    Environment:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        projectId: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        slug: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        sourceType: {type: string, enum: [docker_image, git_dockerfile], default: docker_image, description: Docker Compose workloads are not supported}
        image: {type: string, maxLength: 500}
        internalPort: {type: integer, minimum: 1, maximum: 65535}
        hostAddress: {type: string, description: Explicit IPv4 or IPv6 bind address; omit to publish no host port}
        publishedPort: {type: integer, minimum: 1, maximum: 65535}
        serverId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
    Application:
      allOf:
        - {$ref: '#/components/schemas/ApplicationInput'}
        - type: object
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            organizationId: {$ref: '#/components/schemas/UUID'}
            projectId: {$ref: '#/components/schemas/UUID'}
            environmentId: {$ref: '#/components/schemas/UUID'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    EnvironmentVariableInput:
      type: object
      additionalProperties: false
      required: [name, value]
      properties: {name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}, value: {type: string, maxLength: 32768}}
    EnvironmentVariable:
      allOf:
        - {$ref: '#/components/schemas/EnvironmentVariableInput'}
        - {type: object, properties: {updatedAt: {$ref: '#/components/schemas/Timestamp'}}}
    DotEnvEntry:
      allOf:
        - {$ref: '#/components/schemas/EnvironmentVariableInput'}
        - {type: object, properties: {secretSuggested: {type: boolean}}}
    ScopedVariable:
      allOf:
        - {$ref: '#/components/schemas/EnvironmentVariableInput'}
        - {type: object, properties: {scope: {type: string, enum: [project, environment, application]}, inherited: {type: boolean}}}
    SecretMetadata:
      type: object
      properties: {id: {$ref: '#/components/schemas/UUID'}, name: {type: string}, provider: {type: string, enum: [local]}, projectId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}, environmentId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}, applicationId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}, scope: {type: string, enum: [project, environment, application]}, createdAt: {$ref: '#/components/schemas/Timestamp'}, updatedAt: {$ref: '#/components/schemas/Timestamp'}}
    EffectiveConfiguration:
      type: object
      properties:
        variables: {type: array, items: {$ref: '#/components/schemas/ScopedVariable'}}
        secrets: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}
    RuntimeInstance:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        organizationId: {$ref: '#/components/schemas/UUID'}
        applicationId: {$ref: '#/components/schemas/UUID'}
        deploymentId: {$ref: '#/components/schemas/UUID'}
        provider: {type: string, enum: [docker]}
        serverId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        instanceId: {type: string}
        image: {type: string}
        state: {type: string}
        health: {type: string, enum: [unknown, starting, healthy, unhealthy, running, exited]}
        containerPort: {type: [integer, 'null']}
        hostAddress: {type: [string, 'null']}
        hostPort: {type: [integer, 'null']}
        runtimeCreatedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        runtimeStartedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        runtimeFinishedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
