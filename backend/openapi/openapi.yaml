        regions: {type: array, items: {$ref: '#/components/schemas/AWSCostGroup'}}
        projects: {type: array, items: {$ref: '#/components/schemas/AWSCostGroup'}, description: Cost allocation tag groups; Unallocated is explicit}
        environments: {type: array, items: {$ref: '#/components/schemas/AWSCostGroup'}, description: Cost allocation tag groups; Unallocated is explicit}
        projectAttributionAvailable: {type: boolean}
        environmentAttributionAvailable: {type: boolean}
        total: {type: number, description: Actual unblended cost for the current period}
        previousPeriodTotal: {type: [number, 'null'], description: Actual unblended cost for the prior calendar period when available}
        forecast: {type: [number, 'null'], description: 'AWS Cost Explorer forecast, not actual cost'}
