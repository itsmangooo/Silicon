name: silicon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${SILICON_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SILICON_ADDRESS: :8080
      SILICON_FRONTEND_ORIGIN: ${SILICON_PUBLIC_URL}
      SILICON_PUBLIC_URL: ${SILICON_PUBLIC_URL}
      SILICON_COOKIE_SECURE: ${SILICON_COOKIE_SECURE}
      SILICON_AUTO_MIGRATE: "true"
      SILICON_ENCRYPTION_KEY: ${SILICON_ENCRYPTION_KEY}
      SILICON_AGENT_ALLOW_INSECURE: "false"
      SILICON_TRUST_FORWARDED_PROTO: ${SILICON_TRUST_FORWARDED_PROTO:-false}
      SILICON_AGENT_EXPECTED_VERSION: ${SILICON_AGENT_EXPECTED_VERSION:-0.1.0}
      SILICON_LOG_LEVEL: ${SILICON_LOG_LEVEL:-info}
      SILICON_LOCAL_DOCKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/silicon", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [database, application]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - ${SILICON_BIND_ADDRESS:-0.0.0.0}:${SILICON_HTTP_PORT:-80}:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application]

networks:
  database:
    internal: true
  application:
